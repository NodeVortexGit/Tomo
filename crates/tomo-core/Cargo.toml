[package]
name = "tomo-core"
version = "0.1.0"
edition = "2021"
description = "The brain of Tomo: config, memory, AI decision loop, safe command execution and speech bridge. No graphics dependencies."
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }

# HTTP client for the Claude Messages API. rustls avoids a system OpenSSL dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Embedded database for long-term memory. `bundled` compiles SQLite from source
# so there is no system libsqlite3 requirement.
rusqlite = { version = "0.32", features = ["bundled"] }

# Loads the .env file that holds the API keys.
dotenvy = "0.15"

# Cross-platform, XDG-correct locations for config / data / cache.
directories = "5"

# Screenshots for the model to look at: scaled and re-encoded as JPEG, then
# sent base64-encoded (see screen.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
