[project]
name = "tomo"
version = "0.2.0"
description = "Tomo: a local AI VRM desktop companion for Windows and Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # The brain
    "httpx>=0.27",           # the local model server (Ollama / LM Studio)
    "python-dotenv>=1.0",    # settings from .env
    "chromadb>=1.0",         # long-term memory
    "numpy>=1.26",
    "pillow>=10",            # textures, screenshots
    # The body
    "glfw>=2.7",             # the window
    "moderngl>=5.10",        # OpenGL drawing
    "imgui-bundle>=1.92",    # the chat window and the lock screen
]

[project.optional-dependencies]
# The helpers in scripts/ run with the same Python, so the installers add these.
speech = [
    "piper-tts>=1.3",                            # Tomo's voice (tts_piper.py)
    "vosk>=0.3.41",                              # "Hey Tomo" (wake_word.py)…
    "onnx-asr[cpu,hub]>=0.12",                   # …and what you say, in English or Bulgarian
    "sounddevice>=0.4; sys_platform != 'linux'", # the microphone (Linux uses parecord/pw-record/arecord)
]
camera = [
    "opencv-python>=4.9",    # the camera (pose.py)…
    "mediapipe>=0.10.14",    # …and MediaPipe Pose Lite for the health programme
]
all = ["tomo[speech,camera]"]
dev = ["pytest>=8"]

[project.scripts]
tomo = "tomo.__main__:main"

[project.gui-scripts]
tomo-desktop = "tomo.__main__:main"

[tool.setuptools]
packages = ["tomo", "tomo.body"]

[tool.setuptools.package-data]
"tomo.body" = ["*.glsl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
