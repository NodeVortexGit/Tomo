# Workspace root for Tomo — a local AI VRM desktop companion for Linux and
# Windows.
#
# The project is split into two crates on purpose:
#
#   crates/tomo-core  — the "brain": config, SQLite memory, the local model's
#                       tool-use loop (Ollama / LM Studio), the safe command
#                       executor and speech. It has NO graphics dependencies,
#                       so it compiles fast and is unit-tested on its own
#                       (`cargo test -p tomo-core`).
#
#   crates/tomo-app   — the "body": the Bevy application that loads the VRM
#                       model, floats it above the desktop (a Wayland overlay,
#                       or a transparent window on Windows/X11), runs its
#                       physics, animation, spring bones and MToon shading, and
#                       grows the liquid chat window. It depends on tomo-core.
#
# Build everything:      cargo build --release
# Test everything:       cargo test --workspace
# The Windows installer: see packaging/windows/ and .github/workflows/build.yml

[workspace]
resolver = "2"
members = [
    "crates/tomo-core",
    "crates/tomo-app",
]

# Shared dependency versions live here so the two crates stay in lock-step.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "fs", "io-util", "net"] }

[profile.release]
# The VRM/Bevy build is large; these keep the release binary lean.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
