# Tests on Linux and Windows; on Windows, also the installer,
# Tomo-Setup-<version>.exe — kept as a build artifact, and attached to the
# GitHub release when a version tag (v0.2.0, …) is pushed.
#
# The tests need only Tomo's own packages (the speech and camera extras stay
# out: the tests don't use them). Tests that need a graphics card skip
# themselves on the runners.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: OpenGL libraries (Linux), which the window and interface packages load
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0
      - uses: astral-sh/setup-uv@v6
      - name: Python and Tomo's packages
        run: |
          uv venv --python 3.12
          uv pip install -r pyproject.toml --extra dev
      - name: Tests
        run: uv run --no-sync pytest -q

  installer:
    name: Windows installer
    needs: test
    runs-on: windows-2022
    permissions:
      contents: write # to attach the installer to a release
    steps:
      - uses: actions/checkout@v4

      - name: uv, which sets up Tomo's Python at install time
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath packaging/windows/uv -Force
          if (-not (Test-Path packaging/windows/uv/uv.exe)) { throw "uv.exe missing from the download" }

      - name: The installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart("v") }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging/windows/tomo.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer didn't build" }

      - uses: actions/upload-artifact@v4
        with:
          name: Tomo-Setup-windows
          path: packaging/windows/Output/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/Output/*.exe
